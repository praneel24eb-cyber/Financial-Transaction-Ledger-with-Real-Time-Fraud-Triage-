<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DBMS Fraud Ledger{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <div class="logo-icon">FL</div>
        <span>DBMS Ledger Engine</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a></li>
          <li><a href="/ui/transfer" class="nav-link {% if active_page == 'transfer' %}active{% endif %}">Transfer Triage</a></li>
          <li><a href="/ui/history" class="nav-link {% if active_page == 'history' %}active{% endif %}">Ledger History</a></li>
          <li><a href="/ui/alerts" class="nav-link {% if active_page == 'alerts' %}active{% endif %}">Fraud Alerts</a></li>
          <li><a href="/ui/audit" class="nav-link {% if active_page == 'audit' %}active{% endif %}">Audit Log Chain</a></li>
          <li><a href="/ui/benchmarks" class="nav-link {% if active_page == 'benchmarks' %}active{% endif %}">Benchmarks</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content Body -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>Financial Transaction Ledger with Real-Time Fraud Triage • PostgreSQL 15+ Source of Truth</p>
  </footer>

</body>
</html>
